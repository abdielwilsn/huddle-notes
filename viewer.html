<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Meetings · Huddle Notes</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { display: grid; grid-template-columns: 290px 1fr; height: 100vh; overflow: hidden; }
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  aside header { padding: 16px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); }
  aside header b { font-size: 15px; }
  aside header a { font-size: 12.5px; color: var(--muted); text-decoration: none; }
  #list { overflow-y: auto; flex: 1; padding: 6px; }
  .item { padding: 10px; border-radius: 8px; cursor: pointer; display: grid; gap: 2px; }
  .item:hover { background: var(--soft); }
  .item.active { background: var(--soft); box-shadow: inset 2px 0 0 var(--ink); }
  .item .t { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item .m { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .empty { padding: 24px 16px; color: var(--muted); font-size: 13px; }
  main { overflow-y: auto; min-height: 0; }
  #detail { max-width: 820px; margin: 0 auto; padding: 32px 28px 80px; }
  h1 { font-size: 24px; line-height: 1.25; margin: 0 0 6px; letter-spacing: -.01em; }
  h1 button { font-size: 12px; font-weight: 400; padding: 2px 8px; margin-left: 6px; vertical-align: middle; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
  #progress { margin: 16px 0 0; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 8px; }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 9px 12px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
  .pane { padding-top: 18px; }
  .md h2 { font-size: 18px; margin: 22px 0 6px; }
  .md h3 { font-size: 15px; margin: 22px 0 6px; }
  .md h4 { font-size: 14px; margin: 16px 0 4px; }
  .md h2:first-child, .md h3:first-child { margin-top: 0; }
  .md ul, .md ol { padding-left: 22px; margin: 6px 0; }
  .md li { margin: 3px 0; }
  .md li.task { list-style: none; margin-left: -22px; display: flex; gap: 8px; }
  .md li.task input { width: auto; margin-top: 4px; }
  .md code { font-family: var(--mono); font-size: 12.5px; background: var(--soft); padding: 1px 5px; border-radius: 4px; }
  .md p { margin: 8px 0; }
  #search { margin-bottom: 12px; }
  .line { display: grid; grid-template-columns: 52px auto 1fr; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .line.nospk { grid-template-columns: 52px 1fr; }
  .line .ts { font: 12px/1.9 var(--mono); color: var(--muted); }
  .line .sp { font-size: 12px; font-weight: 600; line-height: 1.9; }
  .line .sp.me { color: var(--ok); }
  mark { background: color-mix(in srgb, var(--warn) 35%, transparent); color: inherit; border-radius: 2px; }
  .part { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .part audio { flex: 1; height: 34px; }
  .placeholder { display: grid; place-items: center; height: 70vh; color: var(--muted); text-align: center; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; } aside { display: none; } }
</style>
</head>
<body>
<aside>
  <header><img src="icons/icon32.png" width="20" height="20" alt=""><b>Meetings</b><span class="spacer"></span><a href="#" id="settings">Settings</a></header>
  <div id="list"></div>
</aside>
<main><div id="detail"></div></main>
<script src="settings.js"></script>
<script src="db.js"></script>
<script src="process.js"></script>
<script src="viewer.js"></script>
</body>
</html>
