<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Allow microphone · Huddle Notes</title>
<link rel="stylesheet" href="styles.css">
<style>
  main { max-width: 460px; margin: 12vh auto; padding: 0 16px; text-align: center; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  button { margin-top: 18px; padding: 10px 18px; }
  #msg { margin-top: 16px; }
</style>
</head>
<body>
<main>
  <img src="icons/icon128.png" width="64" height="64" alt="">
  <h1>Let Huddle Notes hear you</h1>
  <p class="muted">Chrome only asks once. After this, your side of every call is recorded together with the meeting audio. Nothing is recorded until you press Start.</p>
  <button class="primary" id="allow">Allow microphone</button>
  <div id="msg"></div>
</main>
<script src="permission.js"></script>
</body>
</html>
